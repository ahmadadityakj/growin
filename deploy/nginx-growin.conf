# /etc/nginx/sites-available/growin.kreava.id
# ln -s ke sites-enabled, lalu `nginx -t && systemctl reload nginx`
# SSL: sudo certbot --nginx -d growin.kreava.id

server {
    listen 80;
    server_name growin.kreava.id;

    # Naikkan batas upload kalau nanti ada upload file
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
