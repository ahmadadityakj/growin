name: Deploy Growin to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growin-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      AUTH_SECRET: ci-audit-only-not-an-application-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Package release
        run: |
          tar --exclude='.next/cache' --exclude='.next/dev' -czf growin-release.tgz \
            .next public package.json package-lock.json ecosystem.config.js next.config.ts \
            tsconfig.json drizzle.config.ts drizzle src/server src/lib .github/deploy-release.sh
      - name: Retain verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: growin-release
          path: growin-release.tgz
          retention-days: 7

  deploy-production:
    needs: verify-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v4
        with:
          name: growin-release
      - name: Prepare and activate release
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          HEALTH_HOST: ${{ vars.GROWIN_HEALTH_HOST }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing SERVER_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing trusted SERVER_KNOWN_HOSTS}"
          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SERVER_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$HEALTH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F "$SERVER_HOST" -f ~/.ssh/known_hosts >/dev/null
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST")
          RELEASE="/var/www/growin/releases/$RELEASE_ID"
          "${SSH[@]}" "test ! -e '$RELEASE' && mkdir -p '$RELEASE'"
          cat growin-release.tgz | "${SSH[@]}" "tar xzf - -C '$RELEASE'"
          "${SSH[@]}" "GROWIN_HEALTH_HOST='$HEALTH_HOST' bash '$RELEASE/.github/deploy-release.sh' '$RELEASE_ID'"
